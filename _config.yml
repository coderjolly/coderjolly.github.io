baseurl:
title: Harman Jolly 
author: Harman Jolly
simple_search: http://google.com/search
description: Harman Jolly's Personal Webpage
name: Harman Jolly
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
permalink: /articles/:short_year/:title
timezone: Canada/Toronto
excerpt_separator: <!--more-->  # you can specify your own separator, of course.
exclude: ['Gemfile', 'Gemfile.lock', 'Rakefile', 'UploadToGithub.Rakefile', 'README.md', 'vendor']
post:
  template: _post.txt
  extension: md
#page:
#  template: _page.txt
#  extension: md
future: TRUE
show_drafts: TRUE
editor: vim
plugins:
    - jekyll-seo-tag
    - jekyll-youtube
    - jekyll-sitemap

scholar:
  style: modern-language-association
  source: _bibliography


git:
  branch: master
transfer:
  command: rsync
  settings: -av
  source: _site/
